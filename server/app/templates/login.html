{% extends "base.html" %}
{% block content %}
<h1>Freight Auto-Reply</h1>
<div class="card narrow">
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  {% if configured %}<p><a class="button primary" id="sso" href="/auth/login">Log in with SSO</a></p>
  {% else %}<p class="error">Single sign-on is not set up on the server yet.</p>{% endif %}
</div>
{% endblock %}
