name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - run: pipx install uv==0.10.4
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: firefox-extension-unsigned, path: dist/*.zip }
  e2e:
    # Real Firefox + real web app against mock chat sites. No traffic to real platforms.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with: { firefox-version: latest }
      - run: pipx install uv==0.10.4
      - run: uv sync --frozen
        working-directory: server
      - run: npm ci
      - run: npm run test:e2e
        env:
          FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
  image:
    needs: [server, extension, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/kukaraf/freight-autoreply
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Compute tags
        run: echo "SHA_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build (local, not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.SHA_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Smoke test the container
        run: |
          docker run -d --name smoke --read-only --tmpfs /data:uid=10001 -p 8000:8000 "$IMAGE:$SHA_TAG"
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs smoke; exit 1
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE }}:${{ env.SHA_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned image
        run: |
          docker tag "$IMAGE:$SHA_TAG" "$IMAGE:latest"
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:latest"
