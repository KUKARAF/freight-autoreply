<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <div class="row"><h1>Freight Auto-Reply</h1><button id="openOptions">Settings</button></div>
  <label class="inline"><input type="checkbox" id="enabled"> Enabled</label>
  <label class="inline"><input type="checkbox" id="autoSend"> Auto-send replies (off = drafts only)</label>
  <p id="payment" class="warn" hidden>The server requires payment. <a id="paymentLink" target="_blank" rel="noopener">Open payment page</a></p>
  <h2>Drafts waiting for you</h2>
  <div id="drafts"></div>
  <div class="row"><h2>Activity</h2><button id="clearLog">Clear</button></div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
